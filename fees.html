<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drops — минимализм с гладкими краями</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 640px;
            height: 360px;
            background: #0a0a0a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* ГЛАДКОЕ СВЕЧЕНИЕ */
        .glow {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: radial-gradient(ellipse at 50% 100%, 
                        rgba(255, 187, 0, 0.35) 0%, 
                        rgba(255, 187, 0, 0.1) 40%,
                        transparent 80%);
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* ЗВЁЗДЫ */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            color: rgba(255, 255, 255, 0.25);
            font-family: monospace;
            user-select: none;
            pointer-events: none;
            font-size: 8px;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .banner {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        /* КРУПНЫЕ ГЛАДКИЕ ОБЪЕКТЫ — БОЛЕЕ ПРОЗРАЧНЫЕ */
        .shape-oval {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 187, 0, 0.04), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        .shape-circle {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 187, 0, 0.02);
            bottom: -60px;
            right: -60px;
            pointer-events: none;
            z-index: -1;
        }

        .shape-blob {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 187, 0, 0.015);
            top: -50px;
            left: -50px;
            pointer-events: none;
            z-index: -1;
        }

        /* ЗАГОЛОВОК */
        .title {
            font-size: 96px;
            font-weight: 680;
            letter-spacing: -4px;
            color: white;
            line-height: 0.92;
            margin-bottom: 28px;
            text-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        
        .title .accent {
            color: #ffbb00;
            text-shadow: 0 0 8px rgba(255, 187, 0, 0.2);
        }

        /* ПОДЗАГОЛОВОК */
        .subtitle {
            font-size: 13px;
            font-weight: 420;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
        }

        /* ДЕКОРАТИВНАЯ ЛИНИЯ */
        .line {
            width: 50px;
            height: 1px;
            background: rgba(255, 187, 0, 0.45);
            margin: 0 auto;
            border-radius: 2px;
        }

        /* ТОНКАЯ РАМКА */
        .frame {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            bottom: 16px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            pointer-events: none;
            z-index: 12;
        }

        /* МАЛЕНЬКИЙ АКЦЕНТ ВНИЗУ */
        .footer-dot {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            background: rgba(255, 187, 0, 0.45);
            border-radius: 50%;
            z-index: 12;
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    <div class="stars" id="starsContainer"></div>

    <div class="shape-oval"></div>
    <div class="shape-circle"></div>
    <div class="shape-blob"></div>

    <div class="banner">
        <div class="title">
            <span class="accent">D</span>rops
        </div>
        <div class="subtitle">
            instant · limitless
        </div>
        <div class="line"></div>
    </div>

    <div class="frame"></div>
    <div class="footer-dot"></div>

    <script>
        // ЗВЁЗДЫ
        (function() {
            const container = document.getElementById('starsContainer');
            const starCount = 24;
            
            for (let i = 0; i < starCount; i++) {
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = 6 + Math.random() * 8;
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = x + '%';
                star.style.top = y + '%';
                star.style.fontSize = size + 'px';
                star.style.opacity = 0.12 + Math.random() * 0.25;
                star.textContent = '✦';
                container.appendChild(star);
            }
        })();
    </script>
</body>
</html>
